[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evt-context-index"
version = "0.1.0"
description = "Rebuild EVT-bench sliding context indexes for Qwen-GR00T without TVI tokens"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
evt-context-index = "evt_context_index.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

